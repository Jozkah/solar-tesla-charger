    <clipPath id="c1"><rect x="28" y="212" width="372" height="150" rx="16"/></clipPath>
    <clipPath id="c2"><rect x="420" y="212" width="372" height="150" rx="16"/></clipPath>
    <clipPath id="c3"><rect x="28" y="378" width="372" height="150" rx="16"/></clipPath>
