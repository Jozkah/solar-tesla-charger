<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport" />
<meta name="theme-color" content="#050505" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Solar Charger</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: {
        bg: '#050505', surface: '#0e0f12', mut: '#9a9aa2',
        ios: { blue: '#0A84FF', green: '#30D158', amber: '#FFD60A', red: '#FF453A', gray: '#8E8E93' },
      },
      borderRadius: { '2xl': '22px', '3xl': '28px' },
      fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
    } },
  };
</script>
<style>
  body { background:#050505; color:#f2f2f7; font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; -webkit-font-smoothing:antialiased; min-height:100dvh; }
  /* iOS 26 "Liquid Glass" surface: translucent, blurred, vibrant, with a top specular highlight */
  .glass { background:rgba(22,23,28,0.55); backdrop-filter:blur(26px) saturate(160%); -webkit-backdrop-filter:blur(26px) saturate(160%); border:1px solid rgba(255,255,255,0.10); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 10px 30px rgba(0,0,0,.38); }
  .hairline-b { border-bottom:1px solid rgba(255,255,255,0.07); }
  .tnum { font-variant-numeric:tabular-nums; }
  ::-webkit-scrollbar { display:none; }

  /* iOS 26 segmented control — glass track with a floating glass selection pill */
  .seg { display:flex; gap:3px; padding:3px; background:rgba(120,120,128,0.16); border-radius:16px; border:1px solid rgba(255,255,255,0.06); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  .seg button { flex:1; border:0; background:transparent; color:rgba(235,235,245,0.6); font-size:13px; font-weight:600; padding:8px 6px; border-radius:13px; transition:.2s cubic-bezier(.32,.72,0,1); cursor:pointer; }
  .seg button.active { background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.10)); color:#fff; border:1px solid rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 2px 8px rgba(0,0,0,.40); }

  /* iOS 26 Liquid Glass buttons — tinted translucent glass capsules with specular highlight */
  .lg-btn { position:relative; border:0; border-radius:999px; font-weight:600; cursor:pointer; color:#f2f2f7; padding:13px; font-size:15px;
    -webkit-backdrop-filter:blur(16px) saturate(160%); backdrop-filter:blur(16px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.40), inset 0 -1px 1px rgba(0,0,0,.22), 0 6px 18px rgba(0,0,0,.35);
    transition:transform .12s ease, filter .2s ease; }
  .lg-btn:active { transform:scale(.97); filter:brightness(1.08); }
  .lg-btn-green { background:linear-gradient(180deg, rgba(64,224,112,.34), rgba(48,209,88,.16)); border:1px solid rgba(48,209,88,.5); color:#eafff2; }
  .lg-btn-red { background:linear-gradient(180deg, rgba(255,112,122,.34), rgba(255,69,58,.16)); border:1px solid rgba(255,69,58,.5); color:#fff1f0; }
  .lg-btn-blue { background:linear-gradient(180deg, rgba(80,170,255,.34), rgba(10,132,255,.16)); border:1px solid rgba(10,132,255,.5); color:#eaf4ff; }
  .lg-btn-soft { background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06)); border:1px solid rgba(255,255,255,.14); }
  .lg-btn-ghost { background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.08); color:#9a9aa2; box-shadow:inset 0 1px 0 rgba(255,255,255,.12); }

  /* iOS 26 slider — glass thumb */
  input[type=range].ios { -webkit-appearance:none; appearance:none; width:100%; height:8px; border-radius:99px; background:rgba(120,120,128,0.24); outline:none; box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
  input[type=range].ios::-webkit-slider-thumb { -webkit-appearance:none; width:28px; height:28px; border-radius:50%; background:linear-gradient(180deg,#ffffff,#e8e8ee); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 2px 6px rgba(0,0,0,.5); cursor:pointer; }
  input[type=range].ios::-moz-range-thumb { width:28px; height:28px; border:0; border-radius:50%; background:linear-gradient(180deg,#ffffff,#e8e8ee); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 2px 6px rgba(0,0,0,.5); }

  /* connection dot */
  @keyframes pulse-dot { 0%{box-shadow:0 0 0 0 rgba(48,209,88,.7)} 70%{box-shadow:0 0 0 6px rgba(48,209,88,0)} 100%{box-shadow:0 0 0 0 rgba(48,209,88,0)} }
  .dot-live { animation:pulse-dot 2s infinite; }

  /* chart */
  .chart-box { position:relative; touch-action:none; }
  #chart { width:100%; height:176px; display:block; }
  .crosshair { position:absolute; top:0; bottom:18px; width:1px; background:rgba(255,255,255,.35); pointer-events:none; }
  .tooltip { position:absolute; pointer-events:none; background:rgba(10,11,15,.96); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:8px 10px; font-size:12px; box-shadow:0 8px 24px rgba(0,0,0,.5); transform:translate(-50%,-110%); white-space:nowrap; z-index:5; }
  .tooltip .t-time { color:var(--mut,#9a9aa2); margin-bottom:4px; font-size:11px; opacity:.7; }
  .tooltip .t-row { display:flex; align-items:center; gap:6px; }
  .tooltip .t-row i { width:8px; height:8px; border-radius:2px; }
</style>
</head>
<body class="pb-28 overflow-x-hidden">

<!-- decorative glow -->
<div class="fixed inset-0 -z-10 opacity-20 pointer-events-none">
  <div class="absolute -top-[10%] -right-[10%] w-[300px] h-[300px] bg-ios-blue rounded-full blur-[120px]"></div>
  <div class="absolute bottom-[20%] -left-[10%] w-[250px] h-[250px] bg-ios-amber rounded-full blur-[110px]"></div>
</div>

<!-- Top bar -->
<header class="sticky top-0 z-50 bg-bg/80 backdrop-blur-xl border-b border-white/5">
  <div class="flex items-center justify-between px-5 pt-5 pb-3">
    <div>
      <h1 class="text-[26px] font-extrabold tracking-tight leading-none">Solar Charger</h1>
      <div id="foot" class="text-[11px] text-mut mt-1">—</div>
    </div>
    <div id="conn" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-ios-green/15">
      <span id="connDot" class="w-2 h-2 rounded-full bg-ios-green dot-live"></span>
      <span id="connText" class="text-ios-green text-xs font-semibold">Live</span>
    </div>
  </div>
</header>

<main class="px-5 pt-5 flex flex-col gap-5 max-w-[720px] mx-auto">

  <!-- Banner -->
  <section id="banner" class="text-amber-200 text-[13px] rounded-2xl px-4 py-3" style="background:rgba(120,70,30,.35);border:1px solid rgba(180,100,50,.4)" hidden></section>

  <!-- Hero -->
  <section class="glass rounded-3xl p-5 flex flex-col gap-4">
    <div class="flex justify-between items-start">
      <span class="text-mut text-[11px] font-semibold tracking-widest">GRID POWER</span>
      <span id="flow" class="text-mut text-sm">—</span>
    </div>
    <div>
      <h2 class="text-[52px] font-extrabold leading-none tnum tracking-tight"><span id="gridPower">–</span><span class="text-2xl font-medium text-mut ml-1">W</span></h2>
      <div class="flex items-center gap-2 mt-2">
        <span id="gridDot" class="w-2 h-2 rounded-full bg-ios-green"></span>
        <span id="gridLabel" class="text-ios-green text-[15px] font-semibold">—</span>
      </div>
    </div>
    <div class="mt-1 flex flex-col gap-2">
      <div class="flex justify-between text-[11px] font-semibold tracking-wider text-mut">
        <span id="bufferLabel">EXPORT vs BUFFER</span><span id="bufferPct" class="tnum">—</span>
      </div>
      <div class="w-full h-2.5 rounded-full overflow-hidden" style="background:rgba(118,118,128,.25)">
        <div id="bufferBar" class="h-full rounded-full bg-ios-green transition-all duration-500" style="width:0%"></div>
      </div>
      <div id="heroSub" class="text-mut text-[12px] mt-0.5">&nbsp;</div>
    </div>
  </section>

  <!-- Metric grid -->
  <section class="grid grid-cols-2 gap-3.5">
    <div class="glass rounded-2xl p-4 flex flex-col gap-1.5">
      <div class="flex justify-between items-center"><span class="text-ios-amber text-lg">☀️</span><span class="text-mut text-[11px] font-semibold tracking-wider">SOLAR</span></div>
      <span class="text-[22px] font-bold tnum"><span id="solarTotal">–</span><span class="text-sm font-normal text-mut ml-0.5">kW</span></span>
      <span id="solarSub" class="text-[11px] text-mut">&nbsp;</span>
    </div>
    <div class="glass rounded-2xl p-4 flex flex-col gap-1.5">
      <div class="flex justify-between items-center"><span class="text-ios-blue text-lg">⚡</span><span class="text-mut text-[11px] font-semibold tracking-wider">CHARGING</span></div>
      <span class="text-[22px] font-bold tnum"><span id="chargeAmps">–</span><span class="text-sm font-normal text-mut ml-0.5">A</span></span>
      <span id="chargeSub" class="text-[11px] text-mut">&nbsp;</span>
    </div>
    <div class="glass rounded-2xl p-4 flex flex-col gap-1.5">
      <div class="flex justify-between items-center"><span class="text-ios-green text-lg">◎</span><span class="text-mut text-[11px] font-semibold tracking-wider">TARGET</span></div>
      <span class="text-[22px] font-bold tnum"><span id="targetAmps">–</span><span class="text-sm font-normal text-mut ml-0.5">A</span></span>
      <span id="targetSub" class="text-[11px] text-mut">&nbsp;</span>
    </div>
    <div class="glass rounded-2xl p-4 flex flex-col gap-1.5">
      <div class="flex justify-between items-center"><span class="text-mut text-lg">▮</span><span class="text-mut text-[11px] font-semibold tracking-wider">VOLTAGE</span></div>
      <span class="text-[22px] font-bold tnum"><span id="houseV">–</span><span class="text-sm font-normal text-mut ml-0.5">V</span></span>
      <span id="houseVSub" class="text-[11px] text-mut">&nbsp;</span>
    </div>
  </section>

  <!-- Chart -->
  <section class="glass rounded-3xl p-5 flex flex-col gap-3">
    <div class="flex justify-between items-center">
      <span class="text-mut text-[11px] font-semibold tracking-widest">POWER</span>
      <span class="text-[11px] flex items-center">
        <i class="inline-block w-2.5 h-2.5 rounded-sm mr-1" style="background:#30D158"></i><span class="text-mut mr-3">export</span>
        <i class="inline-block w-2.5 h-2.5 rounded-sm mr-1" style="background:#0A84FF"></i><span class="text-mut mr-3">charge</span>
        <i class="inline-block w-2.5 h-2.5 rounded-sm mr-1" style="background:#FFD60A"></i><span class="text-mut mr-3">solar</span>
        <i class="inline-block w-2.5 h-2.5 rounded-sm mr-1" style="background:#FF453A"></i><span class="text-mut">import</span>
      </span>
    </div>
    <div class="seg" id="chartRangeSeg">
      <button data-hours="1" class="active">1h</button>
      <button data-hours="6">6h</button>
      <button data-hours="24">24h</button>
      <button data-hours="168">7d</button>
    </div>
    <div class="chart-box" id="chartBox">
      <svg id="chart" viewBox="0 0 600 220" preserveAspectRatio="none"></svg>
      <div class="tooltip" id="tooltip" hidden></div>
      <div class="crosshair" id="crosshair" hidden></div>
    </div>
  </section>

  <!-- House distribution -->
  <section class="glass rounded-3xl overflow-hidden">
    <div class="px-5 py-4 hairline-b">
      <h3 class="text-[17px] font-semibold">House</h3>
    </div>
    <div class="px-5">
      <div class="grid grid-cols-6 py-2.5 text-[10px] font-semibold text-mut tracking-wider uppercase hairline-b">
        <div class="col-span-2">Circuit</div>
        <div class="text-right">W</div><div class="text-right">V</div><div class="text-right">A</div><div class="text-right">PF</div>
      </div>
      <div id="metersBody"></div>
    </div>
  </section>

  <!-- Controls -->
  <section class="flex flex-col gap-3.5">
    <div class="seg" id="modeSeg">
      <button data-mode="auto" class="active">⚡ Auto</button>
      <button data-mode="pause">⏸ Pause</button>
    </div>

    <div class="glass rounded-3xl p-5 flex flex-col gap-4">
      <div class="flex justify-between items-center">
        <div>
          <div class="text-mut text-[11px] font-semibold tracking-wider uppercase">Charge limit</div>
          <div class="text-[22px] font-bold tnum mt-0.5"><span id="ovVal">16</span><span class="text-sm font-normal text-mut ml-1">Amps</span></div>
        </div>
      </div>
      <input type="range" id="ovRange" class="ios" min="5" max="32" step="1" value="16" />
      <div class="flex justify-between text-[10px] font-semibold text-mut px-0.5"><span>5A</span><span>32A</span></div>
      <div class="flex gap-3">
        <button id="ovApply" class="lg-btn lg-btn-soft flex-1">Hold amps</button>
        <button id="ovClear" class="lg-btn lg-btn-ghost flex-1">Back to auto</button>
      </div>
    </div>

    <button id="chargeToggle" class="lg-btn lg-btn-green w-full py-4 text-[17px]">▶ Start charge</button>
  </section>

  <!-- Statistics -->
  <section class="flex flex-col gap-3.5 pt-1">
    <div class="seg" id="rangeSeg">
      <button data-range="session">Session</button>
      <button data-range="today" class="active">Today</button>
      <button data-range="all">All time</button>
    </div>
    <div id="statsGrid" class="grid grid-cols-3 gap-3"></div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
